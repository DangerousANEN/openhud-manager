<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PROTOKOL Championship</title>
<link rel="stylesheet" href="assets/fonts/quantico.css" />
<link rel="stylesheet" href="hud.css" />
</head>
<body>

<!-- ═══ CHAMPIONSHIP: an arena ceremony HUD.
     Its own components: a crest banner with a laurel score, RADIAL health
     dials (SVG rings, not bars), a player podium deck, a trophy-style
     spotlight card and a framed map plate. ═══ -->

<!-- Crest banner -->
<header id="crest" class="crest hidden">
  <div class="crest-side crest-side--ct">
    <span class="crest-name" id="ct-name">—</span>
    <span class="crest-val" id="ct-score">0</span>
  </div>

  <div class="crest-core">
    <div class="crest-laurel">
      <span class="crest-clock" id="clock">0:00</span>
    </div>
    <span class="crest-round" id="round-state">ROUND 1</span>
    <div class="crest-beads" id="round-beads"></div>
  </div>

  <div class="crest-side crest-side--t">
    <span class="crest-val" id="t-score">0</span>
    <span class="crest-name" id="t-name">—</span>
  </div>
</header>

<!-- Survivor count: top-right, where the original keeps players-alive -->
<div class="tally hidden" id="tally">
  <span class="tally-head">ALIVE</span>
  <span class="tally-body">
    <b class="tally-ct" id="ct-alive">0</b>
    <s>·</s>
    <b class="tally-t" id="t-alive">0</b>
  </span>
</div>

<!-- Podium deck: five plinths per side along the bottom, each with a radial dial -->
<section class="podium podium--ct" id="ct-podium"></section>
<section class="podium podium--t" id="t-podium"></section>

<!-- Framed map plate, centre-left -->
<div class="plate hidden" id="plate">
  <div class="plate-frame">
    <img class="plate-map" id="radar-img" alt="" />
    <div class="plate-dots" id="radar-dots"></div>
    <div class="plate-bomb hidden" id="radar-bomb"></div>
  </div>
  <div class="plate-name" id="plate-name">MAP</div>
</div>

<!-- Spotlight: the spectated player, presented like a trophy plaque -->
<div class="spotlight hidden" id="spotlight">
  <div class="spot-cam" id="cam-slot"><div class="spot-cam-inner" id="cam-inner"></div></div>

  <div class="spot-plaque">
    <div class="spot-rank" id="op-slot">0</div>
    <div class="spot-id">
      <span class="spot-name" id="op-name">—</span>
      <span class="spot-team" id="op-team">—</span>
    </div>
    <div class="spot-dials">
      <svg class="dial" viewBox="0 0 44 44" aria-hidden="true">
        <circle class="dial-bg" cx="22" cy="22" r="18"></circle>
        <circle class="dial-fg dial-fg--hp" id="op-hp-ring" cx="22" cy="22" r="18"></circle>
      </svg>
      <span class="dial-val" id="op-hp">0</span>
      <svg class="dial" viewBox="0 0 44 44" aria-hidden="true">
        <circle class="dial-bg" cx="22" cy="22" r="18"></circle>
        <circle class="dial-fg dial-fg--ar" id="op-ar-ring" cx="22" cy="22" r="18"></circle>
      </svg>
      <span class="dial-val" id="op-ar">0</span>
    </div>
  </div>

  <div class="spot-line">
    <span class="sl"><i>K</i><b id="op-k">0</b></span>
    <span class="sl"><i>A</i><b id="op-a">0</b></span>
    <span class="sl"><i>D</i><b id="op-d">0</b></span>
    <span class="sl"><i>DMG</i><b id="op-adr">0</b></span>
    <span class="sl sl--ammo"><b id="op-ammo">0</b><u id="op-reserve">/0</u></span>
    <span class="spot-gun" id="op-gun"></span>
    <span class="spot-kit" id="op-kit"></span>
  </div>
</div>

<script src="../_core/core.js"></script>
<script src="hud.js"></script>
</body>
</html>
