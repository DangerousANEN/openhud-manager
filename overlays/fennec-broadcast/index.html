<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PROTOKOL Broadcast</title>
<link rel="stylesheet" href="assets/fonts/quantico.css" />
<link rel="stylesheet" href="hud.css" />
</head>
<body>

<!-- ═══ BROADCAST: a television scoreboard HUD.
     Its own components: a centre score bug with an economy strip, a TABLE-style
     roster (header row + data rows, like a stats overlay), a lower-third name
     strap and an inset radar box. No vertical columns, no dossier. ═══ -->

<!-- Score bug: compact centre block, TV style -->
<header id="bug" class="bug hidden">
  <div class="bug-team bug-team--ct">
    <span class="bug-name" id="ct-name">—</span>
    <span class="bug-score" id="ct-score">0</span>
  </div>
  <div class="bug-mid">
    <span class="bug-clock" id="clock">0:00</span>
    <span class="bug-round" id="round-state">RD 1</span>
  </div>
  <div class="bug-team bug-team--t">
    <span class="bug-score" id="t-score">0</span>
    <span class="bug-name" id="t-name">—</span>
  </div>
</header>

<!-- Economy strip under the bug: series of round outcome markers -->
<div class="econ hidden" id="econ">
  <span class="econ-side econ-side--ct" id="ct-econ">$0</span>
  <div class="econ-flow" id="round-flow"></div>
  <span class="econ-side econ-side--t" id="t-econ">$0</span>
</div>

<!-- Roster TABLES: header row + one row per player, like a broadcast stat sheet -->
<section class="sheet sheet--ct" id="ct-sheet">
  <div class="sheet-head">
    <span class="sh sh--tag" id="ct-head">CT</span>
    <span class="sh sh--num">#</span>
    <span class="sh sh--name">PLAYER</span>
    <span class="sh sh--gun">GUN</span>
    <span class="sh sh--hp">HP</span>
    <span class="sh sh--kda">K–A–D</span>
    <span class="sh sh--adr">DMG</span>
    <span class="sh sh--money" id="ct-sh-money">CASH</span>
    <span class="sh sh--eq">EQ</span>
  </div>
  <div class="sheet-rows" id="ct-rows"></div>
</section>

<section class="sheet sheet--t" id="t-sheet">
  <div class="sheet-head">
    <span class="sh sh--tag" id="t-head">T</span>
    <span class="sh sh--num">#</span>
    <span class="sh sh--name">PLAYER</span>
    <span class="sh sh--gun">GUN</span>
    <span class="sh sh--hp">HP</span>
    <span class="sh sh--kda">K–A–D</span>
    <span class="sh sh--adr">DMG</span>
    <span class="sh sh--money" id="t-sh-money">CASH</span>
    <span class="sh sh--eq">EQ</span>
  </div>
  <div class="sheet-rows" id="t-rows"></div>
</section>

<!-- Inset radar box, broadcast corner -->
<div class="inset hidden" id="inset">
  <div class="inset-bar"><span id="inset-map">MAP</span><span class="inset-live">● LIVE</span></div>
  <div class="inset-body">
    <img class="inset-map-img" id="radar-img" alt="" />
    <div class="inset-dots" id="radar-dots"></div>
    <div class="inset-bomb hidden" id="radar-bomb"></div>
  </div>
</div>

<!-- Lower third: name strap + stat line, TV graphics style -->
<footer class="strap hidden" id="strap">
  <div class="strap-cam" id="cam-slot"><div class="strap-cam-inner" id="cam-inner"></div></div>
  <div class="strap-body">
    <div class="strap-top">
      <span class="strap-team" id="op-team">—</span>
      <span class="strap-name" id="op-name">—</span>
      <span class="strap-gun" id="op-gun"></span>
    </div>
    <div class="strap-bottom">
      <span class="sv"><i>HP</i><b id="op-hp">0</b></span>
      <span class="sv"><i>ARMOR</i><b id="op-ar">0</b></span>
      <span class="sv"><i>AMMO</i><b id="op-ammo">0</b><u id="op-reserve">/0</u></span>
      <span class="sv"><i>K</i><b id="op-k">0</b></span>
      <span class="sv"><i>A</i><b id="op-a">0</b></span>
      <span class="sv"><i>D</i><b id="op-d">0</b></span>
      <span class="sv"><i>DMG</i><b id="op-adr">0</b></span>
      <span class="strap-kit" id="op-kit"></span>
    </div>
  </div>
</footer>

<script src="../_core/core.js"></script>
<script src="hud.js"></script>
</body>
</html>
