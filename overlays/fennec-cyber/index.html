<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PROTOKOL Cyber</title>
<link rel="stylesheet" href="assets/fonts/quantico.css" />
<link rel="stylesheet" href="hud.css" />
</head>
<body>

<!-- ═══ CYBER: a vertical tactical HUD.
     Its own components: hex score pods, vertical HP columns, a segmented
     ammo ladder, a utility rail and a corner radar with a scanline sweep.
     Nothing here mirrors the fennec card grid. ═══ -->

<!-- Match pod: two hexagonal score capsules flanking a thin round rail -->
<header id="pods" class="pods hidden">
  <div id="signal-lost" class="signal-lost hidden">SIGNAL LOST</div>
  <div id="timeout-bar" class="rail-timeout hidden">
    <span class="rail-timeout-title" id="timeout-title">PAUSE</span>
    <span class="rail-timeout-count" id="timeout-count"></span>
  </div>

  <div class="pod pod--ct">
    <div class="series-pips" id="ct-series"></div>
    <div class="pod-score" id="ct-score">0</div>
    <div class="pod-meta">
      <span class="pod-name" id="ct-name">—</span>
      <span class="pod-tag">COUNTER</span>
    </div>
  </div>

  <div class="rail">
    <div class="rail-series" id="series-state">BO3 · MAP 1</div>
    <div class="rail-clock" id="clock">0:00</div>
    <div class="rail-bomb hidden" id="bomb-timer"><b>40</b><i></i></div>
    <div class="rail-track" id="round-rail"></div>
    <div class="rail-state" id="round-state">ROUND 1</div>
  </div>

  <div class="pod pod--t">
    <div class="pod-meta">
      <span class="pod-name" id="t-name">—</span>
      <span class="pod-tag">TERROR</span>
    </div>
    <div class="pod-score" id="t-score">0</div>
    <div class="series-pips" id="t-series"></div>
  </div>
</header>

<!-- Vertical HP columns: each player is a tall bar that DRAINS downward -->
<section class="columns columns--ct" id="ct-cols"></section>
<section class="columns columns--t" id="t-cols"></section>

<!-- Utility rail: a single horizontal strip of team utility, bottom centre -->
<div class="urail hidden" id="urail">
  <div class="urail-side" id="ct-util"></div>
  <div class="urail-div">UTILITY</div>
  <div class="urail-side" id="t-util"></div>
</div>

<!-- Corner radar with an animated scan sweep -->
<div class="scope hidden" id="scope">
  <div class="scope-frame">
    <img class="scope-map" id="radar-img" alt="" />
    <div class="scope-sweep"></div>
    <div class="scope-dots" id="radar-dots"></div>
    <div class="scope-bomb hidden" id="radar-bomb"></div>
  </div>
  <div class="scope-label" id="scope-label">DE_MIRAGE</div>
</div>

<!-- Spectated operator: a vertical dossier panel, not a bottom bar -->
<aside class="dossier hidden" id="dossier">
  <div class="dossier-cam" id="cam-slot"><div class="dossier-cam-inner" id="cam-inner"></div></div>

  <div class="dossier-bar">
    <div class="dossier-id">
      <span class="dossier-slot" id="op-slot">0</span>
      <span class="dossier-name" id="op-name">—</span>
    </div>

    <!-- vitals as two stacked meters -->
    <div class="dossier-vitals">
    <div class="meter">
      <span class="meter-key">HP</span>
      <div class="meter-track"><div class="meter-fill meter-fill--hp" id="op-hp-bar"></div></div>
      <span class="meter-val" id="op-hp">0</span>
    </div>
    <div class="meter">
      <span class="meter-key">AR</span>
      <div class="meter-track"><div class="meter-fill meter-fill--ar" id="op-ar-bar"></div></div>
      <span class="meter-val" id="op-ar">0</span>
    </div>
    </div>

    <!-- segmented ammo ladder: one notch per bullet in the magazine -->
    <div class="ladder">
      <div class="ladder-notches" id="op-ladder"></div>
      <div class="ladder-num"><b id="op-ammo">0</b><i id="op-reserve">/0</i></div>
    </div>

    <div class="dossier-gun" id="op-gun"></div>

    <!-- stat chips -->
    <div class="chips">
      <div class="chip"><i>K</i><b id="op-k">0</b></div>
      <div class="chip"><i>A</i><b id="op-a">0</b></div>
      <div class="chip"><i>D</i><b id="op-d">0</b></div>
      <div class="chip chip--wide"><i>DMG</i><b id="op-adr">0</b></div>
    </div>

    <div class="dossier-kit" id="op-kit"></div>
  </div>
</aside>

<script src="../_core/core.js"></script>
<script src="hud.js"></script>
</body>
</html>
